<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Synvora AI Image Generator</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="image-generator">


    <!-- Sidebar -->

    <aside class="ai-sidebar">


        <div class="dash-logo">
            Synvora<span>AI</span>
        </div>


        <ul>

            <li>🤖 AI Chat</li>
            <li>🎨 AI Image</li>
            <li>✍️ AI Writer</li>
            <li>⚡ AI Agents</li>
            <li>📁 Projects</li>

        </ul>


    </aside>




    <!-- Main Content -->


    <main class="image-main">


        <header class="ai-header">


            <h1>
                AI Image Generator
            </h1>



            <a href="dashboard.html">

                <button type="button">
                    Dashboard
                </button>

            </a>


        </header>




        <section class="image-box">


            <h2>
                Create Images With AI
            </h2>


            <p>
                Describe your imagination and let Synvora create it.
            </p>



            <textarea
    id="imagePrompt"
    placeholder="Describe your image... e.g. A futuristic luxury villa at sunset, ultra realistic, 8K">
</textarea>



            <button 
            class="generate-btn"
            type="button">

                Generate Image

            </button>



        </section>





        <section class="generated-area">


            <h2>
                Generated Images
            </h2>



            <div class="image-placeholder">


    <div class="preview-content">


        <div class="image-icon">
            🖼️
        </div>


        <h3>
            AI Generated Image Preview
        </h3>


        <p>
            Your generated images will appear here.
        </p>


        <button class="download-btn">

            Download Image

        </button>


    </div>


</div>



        </section>




    </main>



</div>




<script src="script.js"></script>


</body>

</html>
