<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Synvora Projects</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="projects-page">


    <!-- Sidebar -->

    <aside class="ai-sidebar">


        <div class="dash-logo">
            Synvora<span>AI</span>
        </div>


        <ul>

            <li>🤖 AI Chat</li>
            <li>🎨 AI Image</li>
            <li>✍️ AI Writer</li>
            <li>⚡ AI Agents</li>
            <li>📁 Projects</li>

        </ul>


    </aside>




    <!-- Main Projects Area -->


    <main class="projects-main">



        <header class="ai-header">


            <h1>
                My Projects
            </h1>


            <button>
                + New Project
            </button>


        </header>





        <section class="project-grid">



            <div class="project-card">


                <div class="project-icon">
                    🎨
                </div>


                <h3>
                    Luxury Interior Design
                </h3>


                <p>
                    AI Image Project
                </p>


                <span>
                    Updated Today
                </span>


            </div>






            <div class="project-card">


                <div class="project-icon">
                    ✍️
                </div>


                <h3>
                    Marketing Campaign
                </h3>


                <p>
                    AI Writer Project
                </p>


                <span>
                    Updated Yesterday
                </span>


            </div>






            <div class="project-card">


                <div class="project-icon">
                    ⚡
                </div>


                <h3>
                    SaaS Automation
                </h3>


                <p>
                    AI Agent Project
                </p>


                <span>
                    Updated 2 Days Ago
                </span>


            </div>




        </section>





        <section class="create-project">


            <h2>
                Create New Project
            </h2>


            <input 
            type="text"
            placeholder="Project Name">


            <button>
                Create Project
            </button>


        </section>




    </main>



</div>



</body>

</html>
